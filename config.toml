baseURL = 'https://stargaze2030.vercel.app/'
languageCode = 'en-us'
title = 'Stargaze'
theme = 'PaperMod'
env = 'production'
enableRobotsTXT = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']
  # Only the news section publishes a feed. Other section feeds repeated the news log under the wrong channel title.
  section = ['HTML']

[services]
  [services.rss]
    # Keep the full news log in the feed. Hugo's default cap would drop older items.
    limit = -1

[markup]
  [markup.goldmark]
    renderer = { unsafe = true }

[params]
  description = 'Stargaze tracks orbital data centers: what is flying, manifested, filed, or only announced, and the dated public specifications.'
  keywords = ['space data centers', 'orbital data centers', 'space computing', 'AI infrastructure', 'radiative cooling', 'solar power satellites', 'LEO data centers', 'space solar power']
  author = 'Stargaze Team'
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowRssButton = false
  ShowAllPagesInMenu = false
  defaultTheme = "dark"
  DisableThemeToggle = true
  comments = false
  images = ['/share.png']
  assets = {disableHLJS = false, favicon = '/favicon.svg', favicon_dark = '/favicon.svg', favicon_16x16 = '/favicon-16x16.png', favicon_32x32 = '/favicon-32x32.png', apple_touch_icon = '/apple-touch-icon.png'}

  [params.homepage]
    cover = {hidden = true, caption = '', type = 'image', image = 'share.png'}
    showMore = false
    contentType = 'posts'
    ShowAllPagesInHomepage = false
    NumberOfFeaturedPosts = 0
    socialIcon = ''

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/jla524"

[menu]
  [[menu.main]]
    identifier = "primer"
    name = "Primer"
    url = "/primer/"
    weight = 5
  [[menu.main]]
    identifier = "news"
    name = "News"
    url = "/news/"
    weight = 15
  [[menu.main]]
    identifier = "status"
    name = "Status"
    url = "/status/"
    weight = 17
  [[menu.main]]
    identifier = "companies"
    name = "Companies"
    url = "/companies/"
    weight = 25
