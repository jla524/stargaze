{{- define "main" }}
<article class="post-single">
  <header class="post-header">
    <a class="news-kicker" href="{{ "news/" | relLangURL }}">News</a>
    <h1 class="post-title">{{ .Title }}</h1>
    <div class="post-meta">
      <span>{{ with .Params.displayDate }}{{ . }}{{ else }}{{ .Date | time.Format ":date_long" }}{{ end }}</span>
    </div>
  </header>
  <div class="post-content">
    {{- partial "news_body.html" . }}
  </div>
  <footer class="post-footer">
    {{- partial "post_nav_links.html" . }}
  </footer>
</article>
{{- end }}
